name: Verificar núcleo Python
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install reportlab==4.2.5 pypdf==6.11.0
      - run: python -m unittest discover -s tests -v
      - name: Rendimiento, concurrencia y A4 sintéticos
        run: python packaging/quality-platform.py --output "tmp/calidad con espacios" --samples 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calidad-${{ matrix.os }}-${{ matrix.python }}
          path: tmp/calidad con espacios/acceptance.json
